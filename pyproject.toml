[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pluralforge-ai"
version = "0.7.1"
description = "Cost-aware collective intelligence and auditable multi-agent decision optimization"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "PluralForge AI contributors"}]
dependencies = ["pydantic>=2.4,<3"]

[project.optional-dependencies]
llm = ["litellm>=1,<2"]
mcp = ["mcp>=2,<3"]
api = ["fastapi>=0.110", "uvicorn>=0.30"]
dev = ["pytest>=8", "fastapi>=0.110", "httpx>=0.24"]
all = ["litellm>=1,<2", "mcp>=2,<3", "fastapi>=0.110", "uvicorn>=0.30", "pytest>=8", "httpx>=0.24"]

[project.scripts]
pluralforge-mcp = "arbiter_plugin.mcp_server:main"
arbiter-mcp = "arbiter_plugin.mcp_server:main"

[tool.setuptools.packages.find]
include = ["arbiter_plugin*", "pluralforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
