[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arbiter-ai-collaborative"
version = "0.3.0"
description = "Domain-neutral multi-agent brainstorming with new ideas, persistent dissent and auditable decision scoring"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Arbiter AI contributors"}]
dependencies = ["pydantic>=2.4,<3"]

[project.optional-dependencies]
llm = ["litellm>=1,<2"]
mcp = ["mcp>=2,<3"]
api = ["fastapi>=0.110", "uvicorn>=0.30"]
dev = ["pytest>=8", "fastapi>=0.110", "httpx>=0.24"]
all = ["litellm>=1,<2", "mcp>=2,<3", "fastapi>=0.110", "uvicorn>=0.30", "pytest>=8", "httpx>=0.24"]

[project.scripts]
arbiter-mcp = "arbiter_plugin.mcp_server:main"

[tool.setuptools.packages.find]
include = ["arbiter_plugin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
